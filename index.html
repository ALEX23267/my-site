<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap сайт</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0d1117;
            color: white;
        }

        .hero {
            padding: 100px 0;
            text-align: center;
        }

        .card {
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .footer {
            padding: 20px;
            text-align: center;
            background: #111;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">My Site</a>
    </div>
</nav>

<!-- HERO -->
<section class="hero">
    <div class="container">
        <h1>Мій Bootstrap сайт 🚀</h1>
        <p>Адаптивна верстка з анімацією</p>
        <button class="btn btn-primary">Кнопка</button>
    </div>
</section>

<!-- CARDS -->
<div class="container mb-5">
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card p-3 text-dark">
                <h2>Блок 1</h2>
                <p>Опис першого блоку</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 text-dark">
                <h2>Блок 2</h2>
                <p>Опис другого блоку</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-3 text-dark">
                <h2>Блок 3</h2>
                <p>Опис третього блоку</p>
            </div>
        </div>

    </div>
</div>

<!-- VIDEO -->
<div class="container mb-5 text-center">
    <h2>Відео</h2>
    <div class="ratio ratio-16x9">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>
</div>

<!-- FOOTER -->
<footer class="footer">
    © 2026 Мій сайт
</footer>

</body>
</html>
